name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Format check, lint, typecheck and tests: the same command as locally.
      - run: npm run check

  db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Throwaway credentials created by the install script on this runner only.
      DATABASE_URL: postgresql://serendipity:serendipity@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # PostgreSQL 17 + PostGIS + pgvector, installed the same way as on a developer machine.
      - run: sudo infra/postgres/install-ubuntu.sh
      - run: npm ci
      # Every migration up and down, and the constraints the schema promises.
      - run: npm run test:db

  dev-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The dev environment exactly as a developer starts it (infra/environments/dev.json):
      # the database reports healthy, then the migrate service applies every migration,
      # then the API image starts against it.
      - run: npm run dev:up
      - name: Every migration is applied
        run: |
          applied="$(docker compose -f infra/docker/compose.dev.yml exec -T postgres \
            psql -U serendipity -d serendipity_dev -Atc 'SELECT count(*) FROM public.schema_migrations')"
          expected="$(ls infra/migrations/*.sql | wc -l)"
          echo "applied $applied of $expected"
          test "$applied" = "$expected"
      # The API image (services/api/Dockerfile) against that database: `--wait`
      # returns only once the image's own health check passes.
      - run: docker compose -f infra/docker/compose.dev.yml up --build --detach --wait api
      - name: The API is ready and exposes metrics
        run: |
          curl -fsS http://127.0.0.1:4000/readyz
          curl -fsS http://127.0.0.1:4000/metrics | grep '^serendipity_api_info{env="dev"} 1'
      - name: The image refuses a configuration made for another environment
        run: |
          if docker run --rm -e APP_ENV=prod \
            -e DATABASE_URL=postgresql://serendipity:serendipity@postgres:5432/serendipity_dev \
            serendipity-api:dev; then
            echo "the image started with a dev database in prod"; exit 1
          fi
      # The alert rules (infra/monitoring) fire on their conditions and only then.
      - run: npm run test:alerts
      - name: The API stops cleanly on SIGTERM
        run: |
          docker compose -f infra/docker/compose.dev.yml stop api
          test "$(docker compose -f infra/docker/compose.dev.yml ps -a --format '{{.ExitCode}}' api)" = 0
      - if: failure()
        run: docker compose -f infra/docker/compose.dev.yml logs
      - if: always()
        run: npm run dev:down -- --volumes
